<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Масаж у Києві — класичний, розслабляючий, лімфатичний масаж | Будьте здорові!</title>
<meta name="description" content="Масаж у Києві. Класичний, розслабляючий, лімфатичний, вісцеральний, дитячий масаж та індивідуальні техніки. Запис за телефоном 095 695 96 61.">
<meta name="theme-color" content="#F5F0E6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic">
<link rel="preload" as="image" href="img/master.jpg">
<style>
:root{
  --bg:#F5F0E6; --bg-alt:#EDE5D6; --card:#FBF8F2; --ink:#2A2926; --ink-2:#3C3A35; --ink-3:#4A4640; --muted:#5F5A52; --muted-2:#8A8276;
  --line:#E2D8C7; --line-2:#D8CDBA; --line-3:#CFC3AE; --tan:#C9B9A2; --tan-2:#B9A78C;
  --brown:#7A4E33; --brown-dark:#633E27; --sage:#5E7358; --sage-dark:#4F6149; --sage-light:#8FA487;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:Manrope,system-ui,sans-serif;
  --gutter:clamp(18px,4vw,48px); --sec-pad:clamp(56px,8vw,112px);
}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:var(--brown);text-decoration:none}
a:hover{color:#5A3822}
button{font-family:inherit}
[hidden]{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.anim{animation:fadeUp .35s ease both}

.wrap{max-width:1280px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}
.sec{scroll-margin-top:80px}
.alt{background:var(--bg-alt)}
.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:600;color:var(--sage);text-transform:uppercase}
.h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.4vw,56px);line-height:1.05;margin:18px 0 0}
.btn{display:inline-block;background:var(--brown);color:#FBF8F2;border-radius:999px;font-weight:600;transition:background .2s}
.btn:hover{background:var(--brown-dark);color:#FBF8F2}
.plain{list-style:none;margin:0;padding:0}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:rgba(245,240,230,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{padding-top:14px;padding-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:flex;flex-direction:column;line-height:1.05;color:var(--ink)}
.logo:hover{color:var(--ink)}
.logo b{font-family:var(--serif);font-size:26px;font-weight:600}
.logo small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-top:3px}
.nav{display:flex;gap:26px;align-items:center}
.nav a{font-size:14px;font-weight:500;color:var(--ink-2)}
.nav a:hover{color:var(--brown)}
.hdr-r{display:flex;align-items:center;gap:16px}
.hdr-price{font-size:14px;color:var(--muted);white-space:nowrap}
.langs{display:flex;align-items:center;gap:2px;font-size:13px;font-weight:600}
.lang{border:0;background:transparent;cursor:pointer;padding:8px 7px;letter-spacing:.06em;color:var(--muted-2);border-bottom:1.5px solid transparent;font-weight:600}
.lang[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brown)}
.hdr-cta{padding:12px 22px;font-size:14px;white-space:nowrap}
.burger{width:44px;height:44px;border:1px solid var(--line-2);border-radius:50%;background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.burger span{width:18px;height:1.5px;background:var(--ink);display:block}
.menu{border-top:1px solid var(--line);background:var(--bg);padding-top:12px;padding-bottom:24px;display:flex;flex-direction:column}
.menu>a{font-family:var(--serif);font-size:28px;color:var(--ink);padding:10px 0;border-bottom:1px solid #E7DECF}
.menu-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px;flex-wrap:wrap}
.menu-foot span{font-size:15px;color:var(--muted)}
.menu-foot a{font-size:16px;font-weight:600}
@media (min-width:1140px){.burger,.menu{display:none!important}}
@media (max-width:1139.98px){.nav,.hdr-price{display:none}}

/* hero */
.hero{padding-top:clamp(32px,6vw,80px);padding-bottom:clamp(48px,7vw,96px);display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);align-items:center}
.hero-txt{flex:1 1 440px;min-width:0;animation:fadeUp .7s ease both}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6vw,76px);line-height:1.02;letter-spacing:-.01em;margin:22px 0 0;text-wrap:balance}
.hero-sub{font-size:clamp(17px,1.6vw,19px);line-height:1.6;color:var(--ink-3);margin:24px 0 0;max-width:520px;text-wrap:pretty}
.hero-price{display:flex;align-items:baseline;gap:12px;margin-top:32px}
.hero-price b{font-family:var(--serif);font-size:44px;font-weight:600}
.hero-price span{font-size:16px;color:var(--muted)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:28px}
.hero-ctas .btn{padding:18px 32px;font-size:16px}
.call{display:flex;flex-direction:column;color:var(--ink)}
.call:hover{color:var(--ink)}
.call small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.call span{font-size:19px;font-weight:600;border-bottom:1px solid var(--tan);padding-bottom:2px}
.hero-img{flex:1 1 400px;min-width:0;position:relative}
.arch{border-radius:220px 220px 16px 16px;overflow:hidden;aspect-ratio:4/5;background:#E6DDCC;max-height:720px}
.cover{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:-12px;bottom:28px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 30px rgba(60,45,30,.08)}
.badge small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:600}
.badge span{font-family:var(--serif);font-size:22px}
@media (max-width:480px){.badge{left:8px}}

/* about */
.about{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad);display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,88px);align-items:flex-start}
.about-photo{flex:1 1 340px;min-width:0;max-width:520px}
.ph{border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#DCD2C1}
.about-photo p{font-size:13px;color:var(--muted);margin:12px 0 0}
.about-txt{flex:1 1 440px;min-width:0}
.about-txt .h2{margin-bottom:28px;text-wrap:balance}
.prose{display:flex;flex-direction:column;gap:16px;font-size:17px;line-height:1.7;color:var(--ink-2);max-width:600px}
.prose p{margin:0}
.quote{font-family:var(--serif);font-style:italic;font-size:30px!important;line-height:1.25!important;color:var(--brown)}
.story{display:flex;flex-direction:column;gap:16px;padding-top:8px;border-top:1px solid var(--line-2)}
.btn-ghost{margin-top:28px;background:transparent;border:1px solid var(--brown);color:var(--brown);padding:14px 24px;border-radius:999px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.btn-ghost:hover{background:var(--brown);color:#FBF8F2}

/* services */
.services{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:44px}
.sec-head .h2{margin-bottom:12px}
.sec-head p{font-size:18px;color:var(--ink-3);margin:0}
.sec-head>span{font-size:15px;color:var(--muted)}
.grid-svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 24px 22px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,transform .2s}
.svc:hover{border-color:var(--tan-2);transform:translateY(-2px)}
.svc-top{display:flex;justify-content:space-between;align-items:center}
.svc-top span:first-child{font-family:var(--serif);font-size:22px;color:var(--sage)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--tan)}
.svc h3{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1;margin:4px 0 0}
.svc-desc{font-size:15px;line-height:1.6;color:var(--ink-3);margin:0;flex:1}
.svc-warn{font-size:14px;line-height:1.5;color:#6B3F24;background:#F1E4D6;border-radius:10px;padding:10px 12px;margin:0}
.svc-more{font-size:15px;line-height:1.6;color:var(--ink-2);margin:0;padding-top:12px;border-top:1px solid #E7DECF}
.link-btn{align-self:flex-start;border:0;background:transparent;padding:6px 0;font-size:14px;font-weight:600;color:var(--brown);cursor:pointer;display:flex;gap:8px;align-items:center}
.link-btn span{font-size:18px;line-height:1}

/* price */
.price-out{padding:0 clamp(12px,3vw,32px)}
.price{max-width:1280px;margin:0 auto;background:var(--sage-dark);color:var(--bg);border-radius:28px;padding:clamp(44px,7vw,96px) clamp(24px,6vw,88px);display:flex;flex-wrap:wrap;gap:40px;align-items:center;justify-content:space-between}
.price-l{flex:1 1 360px}
.price .eyebrow{color:#D9E0CF}
.price-big{font-family:var(--serif);font-weight:500;font-size:clamp(80px,13vw,168px);line-height:.9;margin-top:18px;letter-spacing:-.02em}
.price-big span{font-size:.42em}
.price-unit{font-size:clamp(18px,2vw,22px);margin-top:14px}
.price-note{font-size:15px;line-height:1.6;color:#DCE3D3;max-width:460px;margin:22px 0 0}
.price-r{flex:0 1 360px;display:flex;flex-direction:column;gap:16px;text-align:center}
.price-cta{background:var(--bg);color:var(--ink);padding:22px 32px;border-radius:999px;font-size:18px;font-weight:700;transition:background .2s}
.price-cta:hover{background:#fff;color:var(--ink)}
.price-tel{color:var(--bg);font-size:24px;font-weight:600;letter-spacing:.02em}
.price-tel:hover{color:#fff}
.price-r>span{font-size:14px;color:#D9E0CF}

/* steps / who */
.steps{padding-top:var(--sec-pad);padding-bottom:clamp(40px,5vw,64px)}
.steps .h2{margin-bottom:44px}
.steps ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:28px}
.steps li{border-top:1px solid var(--tan-2);padding-top:20px;display:flex;flex-direction:column;gap:10px;position:relative}
.steps li::before{content:"";position:absolute;top:-6px;left:0;width:11px;height:11px;border-radius:50%;background:var(--sage)}
.steps .n{font-family:var(--serif);font-size:20px;color:var(--sage);margin-top:6px}
.steps h3{font-family:var(--serif);font-weight:600;font-size:28px;margin:0}
.steps p{font-size:16px;line-height:1.6;color:var(--ink-3);margin:0}
.who{padding-top:clamp(40px,5vw,64px);padding-bottom:var(--sec-pad);display:flex;flex-wrap:wrap;gap:32px 64px}
.who .h2{flex:0 1 320px;margin:0}
.who ul{flex:1 1 480px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0 32px}
.who li{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px;color:var(--ink-2)}
.who li::before{content:"";flex:none;width:9px;height:9px;background:var(--sage-light);transform:rotate(45deg)}

/* approach */
.approach{max-width:960px;margin:0 auto;padding:clamp(64px,9vw,128px) var(--gutter);text-align:center}
.approach .h2{margin-bottom:32px}
.approach-lead{font-family:var(--serif);font-style:italic;font-size:clamp(30px,3.6vw,44px);line-height:1.2;color:var(--brown);margin:0 0 32px}
.approach-txt{display:flex;flex-direction:column;gap:18px;font-size:18px;line-height:1.7;color:var(--ink-2);max-width:680px;margin:0 auto;text-wrap:pretty}
.approach-txt p{margin:0}

/* education */
.edu{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad)}
.edu-head{display:flex;flex-wrap:wrap;gap:32px 64px;align-items:flex-end;margin-bottom:44px}
.edu-head>div:first-child{flex:1 1 460px}
.edu-head .h2{margin-bottom:16px}
.edu-head p{font-size:17px;line-height:1.7;color:var(--ink-3);margin:0;max-width:560px}
.edu-photo{flex:0 1 300px;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#DCD2C1}
.grid-edu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.edu-cat{padding:28px}
.edu-cat h3{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 18px}
.edu-cat li{font-size:15px;color:var(--ink-2);padding:9px 0;border-bottom:1px solid #EFE7DA}
.acc{margin-top:16px}
.acc-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:transparent;border:0;padding:22px 28px;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);text-align:left}
.acc-btn span{font-size:22px;color:var(--brown)}
.acc-body{padding:0 28px 28px;display:flex;flex-wrap:wrap;gap:32px 56px}
.acc-body ol{margin:0;padding-left:22px;columns:2 220px;column-gap:32px;font-size:15px;line-height:1.9;color:var(--ink-2)}
.acc-body h4{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 8px}
.acc-body p{font-size:15px;line-height:1.6;color:var(--ink-3);margin:0 0 12px}
.acc-body ul{font-size:15px;line-height:1.9;color:var(--ink-2)}

/* extra */
.extra{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad)}
.extra>.h2{margin-bottom:32px}
.grid-extra{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.xcard{background:var(--bg);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.xcard h3{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.15;margin:0}
.xcard p{font-size:14px;line-height:1.55;color:var(--ink-3);margin:0}
.small-note{font-size:14px;line-height:1.6;color:var(--muted);margin:18px 0 0;max-width:760px}
.grid-proc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:48px}
.proc{background:var(--card);border:1px solid #DCD2C1;border-radius:18px;padding:clamp(24px,3vw,36px);display:flex;flex-direction:column;gap:14px}
.proc h3{font-family:var(--serif);font-weight:500;font-size:36px;margin:0}
.proc>p{font-size:16px;line-height:1.65;color:var(--ink-2);margin:0}
.proc .tint{font-size:15px;line-height:1.6;color:var(--ink-3);padding:14px 16px;background:#F1EBDF;border-radius:10px}
.proc-btn{display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;border-top:1px solid var(--line);padding:16px 0 0;cursor:pointer;font-size:15px;font-weight:600;color:var(--brown);text-align:left}
.proc-btn span{font-size:20px}
.proc ul{margin:0;padding-left:20px;font-size:15px;line-height:1.7;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.proc-more{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.7;color:var(--ink-2)}
.proc-more p{margin:0}

/* gallery */
.gallery{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad)}
.gal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-3);background:transparent;color:var(--ink-2);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.masonry{columns:3 260px;column-gap:14px}
.masonry figure{break-inside:avoid;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#E6DDCC;position:relative}
.masonry button{all:unset;display:block;width:100%;cursor:zoom-in;overflow:hidden}
.masonry button:focus-visible{outline:2px solid var(--brown);outline-offset:-2px}
.masonry img{width:100%;height:auto;display:block;transition:transform .5s ease}
.masonry figure:hover img{transform:scale(1.03)}
.masonry figcaption{padding:10px 14px 12px;font-size:13px;color:var(--ink-3);background:var(--card)}
.gallery .small-note{font-size:13px;margin-top:14px}

/* faq */
.faq{padding-top:var(--sec-pad);padding-bottom:var(--sec-pad);display:flex;flex-wrap:wrap;gap:32px 72px}
.faq-l{flex:0 1 340px}
.faq-l .h2{margin-bottom:20px}
.faq-l a{font-size:16px;font-weight:600}
.faq-list{flex:1 1 480px;min-width:0;border-top:1px solid var(--line-3)}
.faq-item{border-bottom:1px solid var(--line-3)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:transparent;border:0;padding:22px 0;cursor:pointer;text-align:left;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink)}
.faq-q span{flex:none;font-family:var(--sans);font-size:22px;font-weight:400;color:var(--brown)}
.faq-a{margin:0;padding:0 40px 22px 0;font-size:16px;line-height:1.65;color:var(--ink-2)}

/* final */
.final{padding-top:clamp(72px,10vw,140px);padding-bottom:clamp(72px,10vw,140px);text-align:center}
.final h2{font-family:var(--serif);font-weight:500;font-size:clamp(42px,6vw,80px);line-height:1.02;margin:0 auto;max-width:900px;text-wrap:balance}
.final>p{font-size:19px;color:var(--ink-3);margin:20px 0 40px}
.final .btn{padding:24px 44px;font-size:18px;font-weight:700}
.final-tel{display:inline-block;margin-top:22px;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:.02em}

/* footer */
.foot{background:var(--ink);color:#E9E2D5}
.foot-in{padding-top:clamp(48px,6vw,80px);padding-bottom:32px}
.foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:36px;padding-bottom:40px;border-bottom:1px solid #45423C}
.foot-brand{display:flex;flex-direction:column;gap:6px}
.foot-brand b{font-family:var(--serif);font-size:36px;font-weight:600;color:var(--bg)}
.foot-brand small{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#B7C2AE}
.foot-brand a{color:var(--bg);font-size:20px;font-weight:600;margin-top:14px}
.foot-nav{display:grid;grid-template-columns:repeat(2,auto);gap:10px 40px;align-content:start}
.foot-nav a{color:#D8D0C2;font-size:15px}
.foot-nav a:hover{color:#fff}
.foot-langs{display:flex;gap:2px;align-items:flex-start;font-size:13px;font-weight:600}
.foot-lang{border:1px solid #45423C;background:transparent;color:#D8D0C2;cursor:pointer;padding:9px 14px;border-radius:999px;letter-spacing:.06em;font-weight:600}
.foot-lang[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.foot-disc{font-size:13px;line-height:1.7;color:#B5AEA2;margin:28px 0 0;max-width:900px}
.foot-copy{font-size:12px;color:#8C857A;margin:20px 0 0}

/* mobile bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(245,240,230,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #DCD2C1;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none;gap:10px}
.mbar a{flex:1;min-height:50px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:16px}
.mbar a:first-child{border:1px solid var(--brown);color:var(--ink);font-weight:600}
.mbar a:last-child{background:var(--brown);color:#FBF8F2;font-weight:700}
@media (max-width:759.98px){
  .mbar{display:flex}
  .page{padding-bottom:76px}
  .hdr-cta{display:none}
}

/* lightbox */
